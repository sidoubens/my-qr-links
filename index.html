<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: #14161f; color: #f2f4f8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 480px; padding: 28px 16px 40px; }
  h1 { font-size: 22px; text-align: center; margin: 0 0 22px; word-break: break-word; }
  #list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  a.card {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: #1e2130; border: 1px solid #2b3047; border-radius: 16px;
    padding: 14px 6px 10px; color: inherit; text-decoration: none;
  }
  a.card:active { background: #272c42; }
  .logo {
    width: 64px; height: 64px; border-radius: 14px;
    object-fit: contain; background: #fff; padding: 6px;
  }
  .fallback {
    width: 64px; height: 64px; border-radius: 14px;
    background: #1565c0; color: #fff; font-weight: 700; font-size: 24px;
    display: flex; align-items: center; justify-content: center;
  }
  .name { font-size: 12px; color: #9aa3bd; text-align: center; }
  .msg { text-align: center; color: #9aa3bd; margin-top: 40px; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div id="list"></div>
  <p class="msg" id="msg"></p>
</main>
<script>
const NAMES = {
  f: "Facebook", d: "Discord", i: "Instagram", l: "LinkedIn",
  lc: "Localisation", p: "Pinterest", s: "Snapchat", t: "TikTok",
  tl: "Telegram", w: "WhatsApp", wb: "Web Page", x: "X", y: "YouTube"
};

// مسار مجلد الشعارات (يجب أن يكون مجلد logo_qr بجانب هذا الملف)
const LOGO_DIR = "logo_qr/";

function b64urlToBytes(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function decode(hash) {
  const bytes = b64urlToBytes(hash);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  const text = await new Response(stream).text();
  return JSON.parse(text);
}

function fullUrl(v) {
  return /^https?:\/\//i.test(v) ? v : "https://" + v;
}

(async function () {
  const msg = document.getElementById("msg");
  try {
    const hash = location.hash.slice(1);
    if (!hash) { msg.textContent = "No links."; return; }
    const data = await decode(hash);
    const title = document.getElementById("title");
    title.textContent = data.n || "My Links";
    document.title = title.textContent;
    const list = document.getElementById("list");

    for (const [id, value] of data.l) {
      const url = fullUrl(value);
      if (!/^https?:\/\//i.test(url)) continue;

      const a = document.createElement("a");
      a.className = "card";
      a.href = url;
      a.rel = "noopener";

      const img = document.createElement("img");
      img.className = "logo";
      img.alt = "";
      img.src = LOGO_DIR + id + "1.png";
      img.onerror = function () {
        const f = document.createElement("div");
        f.className = "fallback";
        f.textContent = (NAMES[id] || id).charAt(0);
        img.replaceWith(f);
      };

      const n = document.createElement("div");
      n.className = "name";
      n.textContent = NAMES[id] || id;

      a.append(img, n);
      list.appendChild(a);
    }
  } catch (e) {
    msg.textContent = "Invalid or unsupported link.";
  }
})();
</script>
</body>
</html>
